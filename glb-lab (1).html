<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLB Lab</title>
<style>
:root{
  --bg:#0d0d0f; --panel:#161618; --gold:#d4af37; --gold-dim:#8a7126;
  --text:#eae6da; --text-dim:#9a978c; --ok:#4caf50; --bad:#e05555;
  box-sizing:border-box;
}
*{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
#app{display:flex;height:100%;width:100%;}
#sidebar{width:280px;min-width:220px;background:var(--panel);border-right:1px solid #26221a;
  display:flex;flex-direction:column;overflow:hidden;}
#sidebar h1{font-size:15px;letter-spacing:.08em;color:var(--gold);padding:16px;margin:0;
  border-bottom:1px solid #26221a;text-transform:uppercase;}
#projList{flex:1;overflow-y:auto;padding:8px;}
.proj{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;margin-bottom:6px;}
.proj:hover{background:#1f1c15;}
.proj.active{border-color:var(--gold-dim);background:#221e14;}
.proj img{width:36px;height:36px;object-fit:cover;border-radius:6px;background:#000;}
.proj .ph{width:36px;height:36px;border-radius:6px;background:#2a271e;display:flex;
  align-items:center;justify-content:center;font-size:16px;}
.proj span{font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#addForm{padding:12px;border-top:1px solid #26221a;display:flex;flex-direction:column;gap:8px;}
#addForm input[type=text]{background:#0f0f10;border:1px solid #2a271e;color:var(--text);
  padding:8px;border-radius:6px;font-size:13px;}
.filebtn{background:#0f0f10;border:1px dashed #3a3527;color:var(--text-dim);padding:8px;
  border-radius:6px;font-size:12px;text-align:center;cursor:pointer;}
.filebtn input{display:none;}
#addForm button{background:var(--gold);color:#1a1608;border:none;padding:9px;border-radius:6px;
  font-weight:600;cursor:pointer;font-size:13px;}
#main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0;}
#canvasWrap{flex:1;position:relative;}
canvas{display:block;width:100%;height:100%;}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:14px;text-align:center;padding:20px;}
#hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;
  gap:12px;pointer-events:none;}
#hud>*{pointer-events:auto;}
#controls{background:var(--panel);border-top:1px solid #26221a;padding:14px 16px;
  display:flex;flex-direction:column;gap:10px;max-height:38vh;overflow-y:auto;}
.row{display:flex;align-items:center;gap:10px;}
.row label{font-size:12px;color:var(--text-dim);min-width:90px;}
.row input[type=range]{flex:1;accent-color:var(--gold);}
button.pill{background:transparent;border:1px solid var(--gold-dim);color:var(--gold);
  padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;}
button.pill:hover{background:#221e14;}
#partsList{display:flex;flex-direction:column;gap:5px;margin-top:4px;}
.partRow{display:flex;align-items:center;gap:8px;font-size:12px;background:#0f0f10;
  padding:6px 10px;border-radius:6px;border-left:3px solid #3a3527;}
.partRow.ok{border-left-color:var(--ok);}
.partRow.bad{border-left-color:var(--bad);}
.partRow span.pname{flex:1;color:var(--text);}
.partRow input[type=range]{width:110px;accent-color:var(--gold);}
#status{font-size:12px;color:var(--text-dim);}
@media (max-width:640px){#sidebar{position:absolute;z-index:5;height:100%;transform:translateX(-100%);
  transition:transform .2s;} #sidebar.open{transform:translateX(0);}
  #hud{top:calc(14px + env(safe-area-inset-top,0px));}}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>🧩 GLB Lab</h1>
    <div id="projList"></div>
    <div id="addForm">
      <input type="text" id="pname" placeholder="Project name">
      <label class="filebtn" id="glbLbl">Choose .glb file<input type="file" id="pglb" accept=".glb,.gltf"></label>
      <label class="filebtn" id="imgLbl">Optional thumbnail image<input type="file" id="pimg" accept="image/*"></label>
      <button id="addBtn">Add GLB project</button>
    </div>
    <div id="photoForm" style="border-top:1px solid #26221a;padding:12px;display:flex;flex-direction:column;gap:8px;">
      <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;">Or generate from a photo</div>
      <input type="text" id="phname" placeholder="Project name">
      <label class="filebtn" id="photoLbl">Choose a photo<input type="file" id="pphoto" accept="image/*"></label>
      <button id="addPhotoBtn" style="background:transparent;border:1px solid var(--gold);color:var(--gold);">Add from photo</button>
    </div>
  </div>
  <div id="main">
    <div id="canvasWrap">
      <div id="empty">Add a .glb file to begin.<br>Pieces come straight from the model's own scene graph — nothing is invented from a photo.</div>
      <div id="hud"><button class="pill" id="menuBtn">☰</button></div>
    </div>
    <div id="controls" style="display:none">
      <div class="row"><label>Explode</label><input type="range" id="explode" min="0" max="2" step="0.01" value="0"></div>
      <div class="row">
        <button class="pill" id="scrambleBtn">Scramble (challenge)</button>
        <button class="pill" id="checkBtn">Check assembly</button>
        <span id="status"></span>
      </div>
      <div id="partsList"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
let projects = [];
try { projects = JSON.parse(localStorage.getItem('glblab_projects')||'[]'); } catch(e){ projects=[]; }

function saveProjects(){
  try { localStorage.setItem('glblab_projects', JSON.stringify(projects)); }
  catch(e){ console.warn('Could not persist (likely storage quota); session-only.', e); }
}

// --- three.js setup ---
const wrap = document.getElementById('canvasWrap');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d0f);
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
camera.position.set(3,2,4);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.outputEncoding = THREE.sRGBEncoding;
wrap.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff2d0, 0x1a1610, 1.1));
const dir = new THREE.DirectionalLight(0xffffff,0.6); dir.position.set(3,5,2); scene.add(dir);

function resize(){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w,h); camera.aspect = w/Math.max(h,1); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);
(function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); })();

let currentGroup = null, parts = []; // {mesh,name,origPos,origQuat,dir,dist}

function clearScene(){ if(currentGroup){ scene.remove(currentGroup); currentGroup=null; } parts=[]; }

function loadGLBFromBase64(b64){
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  const loader = new THREE.GLTFLoader();
  loader.parse(buf.buffer, '', (gltf)=>{
    clearScene();
    currentGroup = gltf.scene;
    scene.add(currentGroup);

    // Fit camera
    const box = new THREE.Box3().setFromObject(currentGroup);
    const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x,size.y,size.z) || 1;
    camera.position.set(center.x+maxDim*1.2, center.y+maxDim*0.8, center.z+maxDim*1.2);
    controls.target.copy(center); controls.update();

    // Collect real parts straight from the file's own node hierarchy.
    // No shape is invented here — each top-level mesh/group IS a piece
    // the model's author already separated.
    let nodes = [];
    currentGroup.children.forEach(c=>nodes.push(c));
    if(nodes.length<2){ nodes=[]; currentGroup.traverse(o=>{ if(o.isMesh) nodes.push(o); }); }

    parts = nodes.map((n,i)=>{
      const b = new THREE.Box3().setFromObject(n);
      const c = b.isEmpty()? n.position.clone() : b.getCenter(new THREE.Vector3());
      let d = c.clone().sub(center);
      const dist = d.length();
      d = dist>0.0001 ? d.normalize() : new THREE.Vector3(0,1,0);
      return { mesh:n, name:n.name||('part_'+(i+1)), origPos:n.position.clone(),
               origQuat:n.quaternion.clone(), dir:d, scale:Math.max(dist,maxDim*0.4) };
    });

    document.getElementById('empty').style.display='none';
    document.getElementById('controls').style.display='flex';
    document.getElementById('explode').value=0;
    renderParts();
    setStatus('Loaded '+parts.length+' piece(s) from the model.');
  }, (err)=>{ setStatus('Could not parse this file as glTF/GLB.'); console.error(err); });
}

function applyExplode(t){
  parts.forEach(p=>{
    p.mesh.position.copy(p.origPos).addScaledVector(p.dir, t*p.scale);
  });
}
document.getElementById('explode').addEventListener('input', e=>{
  applyExplode(parseFloat(e.target.value));
});

function renderParts(){
  const list = document.getElementById('partsList'); list.innerHTML='';
  parts.forEach((p,i)=>{
    const row = document.createElement('div'); row.className='partRow'; row.dataset.i=i;
    row.innerHTML = `<span class="pname">${p.name}</span>
      <input type="range" min="0" max="2" step="0.01" value="0" data-i="${i}">`;
    list.appendChild(row);
  });
  list.querySelectorAll('input[type=range]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = +e.target.dataset.i, p = parts[i];
      p.mesh.position.copy(p.origPos).addScaledVector(p.dir, parseFloat(e.target.value)*p.scale);
    });
  });
}

function setStatus(s){ document.getElementById('status').textContent = s; }

document.getElementById('scrambleBtn').addEventListener('click', ()=>{
  document.getElementById('explode').value = 0;
  parts.forEach((p,i)=>{
    const t = 0.6 + Math.random()*1.4;
    p.mesh.position.copy(p.origPos).addScaledVector(p.dir, t*p.scale);
    const row = document.querySelectorAll('.partRow')[i];
    row.querySelector('input').value = t;
    row.classList.remove('ok','bad');
  });
  setStatus('Scrambled. Drag each slider back until it locks in correctly, then check.');
});

document.getElementById('checkBtn').addEventListener('click', ()=>{
  let good=0;
  parts.forEach((p,i)=>{
    const dist = p.mesh.position.distanceTo(p.origPos);
    const tol = Math.max(p.scale*0.06, 0.03);
    const row = document.querySelectorAll('.partRow')[i];
    row.classList.remove('ok','bad');
    if(dist<tol){ row.classList.add('ok'); good++; } else { row.classList.add('bad'); }
  });
  setStatus(good+' / '+parts.length+' pieces correctly assembled '+
    '(checked against the model\\'s own original transforms).');
});

// --- coarse silhouette shape classifier (real pixel analysis, not a full CV model) ---
function classifyShapeFromImage(imgEl){
  const w=64,h=64;
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d'); ctx.drawImage(imgEl,0,0,w,h);
  const data=ctx.getImageData(0,0,w,h).data;
  const px=(x,y)=>{const i=(y*w+x)*4;return [data[i],data[i+1],data[i+2]];};
  const corners=[px(0,0),px(w-1,0),px(0,h-1),px(w-1,h-1)];
  const bg=[0,1,2].map(c=>corners.reduce((s,p)=>s+p[c],0)/4);
  const isFg=(x,y)=>{const p=px(x,y);return (Math.abs(p[0]-bg[0])+Math.abs(p[1]-bg[1])+Math.abs(p[2]-bg[2]))>60;};
  let minX=w,maxX=0,minY=h,maxY=0,fg=0; const rowW=new Array(h).fill(0);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(isFg(x,y)){ fg++; if(x<minX)minX=x; if(x>maxX)maxX=x;
    if(y<minY)minY=y; if(y>maxY)maxY=y; rowW[y]++; } }
  if(fg<20) return {shape:'box', label:'no clear silhouette found — defaulted to a box'};
  const bw=maxX-minX+1, bh=maxY-minY+1, fill=fg/(bw*bh), aspect=bw/bh;
  const band=Math.max(1,Math.floor(bh*0.2));
  const top=rowW.slice(minY,minY+band).reduce((a,b)=>a+b,0);
  const bot=rowW.slice(maxY-band+1,maxY+1).reduce((a,b)=>a+b,0);
  if(top<bot*0.55 && fill<0.78) return {shape:'house', label:'narrower top over a wider base — read as a house-like silhouette'};
  if(fill>0.72 && aspect>0.8 && aspect<1.25) return {shape:'sphere', label:'round, even fill — read as a sphere'};
  if(fill>0.62) return {shape:'cylinder', label:'rounded, elongated fill — read as a cylinder'};
  if(fill<0.5) return {shape:'triangle', label:'low fill, pointed — read as a cone/pyramid'};
  return {shape:'box', label:'rectangular fill — read as a box'};
}

// pre-built geometric disassembly templates, textured with the uploaded photo
function buildTemplateGroup(shape, tex){
  const mat = new THREE.MeshStandardMaterial({map:tex, side:THREE.DoubleSide, roughness:0.75});
  const group = new THREE.Group();
  const defs = []; // {geo, pos:[x,y,z], dir:[x,y,z], name}
  if(shape==='box'){
    defs.push({geo:new THREE.BoxGeometry(0.06,1,1), pos:[0.5,0,0], dir:[1,0,0], name:'right panel'});
    defs.push({geo:new THREE.BoxGeometry(0.06,1,1), pos:[-0.5,0,0], dir:[-1,0,0], name:'left panel'});
    defs.push({geo:new THREE.BoxGeometry(1,0.06,1), pos:[0,0.5,0], dir:[0,1,0], name:'top panel'});
    defs.push({geo:new THREE.BoxGeometry(1,0.06,1), pos:[0,-0.5,0], dir:[0,-1,0], name:'bottom panel'});
    defs.push({geo:new THREE.BoxGeometry(1,1,0.06), pos:[0,0,0.5], dir:[0,0,1], name:'front panel'});
    defs.push({geo:new THREE.BoxGeometry(1,1,0.06), pos:[0,0,-0.5], dir:[0,0,-1], name:'back panel'});
  } else if(shape==='cylinder'){
    defs.push({geo:new THREE.CylinderGeometry(0.5,0.5,0.7,24,1,true), pos:[0,0,0], dir:[0,0,1], name:'tube'});
    defs.push({geo:new THREE.CylinderGeometry(0.5,0.5,0.04,24), pos:[0,0.37,0], dir:[0,1,0], name:'top cap'});
    defs.push({geo:new THREE.CylinderGeometry(0.5,0.5,0.04,24), pos:[0,-0.37,0], dir:[0,-1,0], name:'bottom cap'});
  } else if(shape==='sphere'){
    defs.push({geo:new THREE.SphereGeometry(0.5,24,12,0,Math.PI*2,0,Math.PI/2), pos:[0,0,0], dir:[0,1,0], name:'top hemisphere'});
    defs.push({geo:new THREE.SphereGeometry(0.5,24,12,0,Math.PI*2,Math.PI/2,Math.PI/2), pos:[0,0,0], dir:[0,-1,0], name:'bottom hemisphere'});
  } else if(shape==='triangle'){
    defs.push({geo:new THREE.CircleGeometry(0.5,24).rotateX(-Math.PI/2), pos:[0,-0.4,0], dir:[0,-1,0], name:'base'});
    defs.push({geo:new THREE.ConeGeometry(0.5,0.8,24,1,true), pos:[0,0,0], dir:[0,1,0], name:'cone shell'});
  } else if(shape==='house'){
    defs.push({geo:new THREE.BoxGeometry(0.8,0.6,0.8), pos:[0,-0.05,0], dir:[0,-1,0], name:'body'});
    defs.push({geo:new THREE.ConeGeometry(0.65,0.5,4,1).rotateY(Math.PI/4), pos:[0,0.5,0], dir:[0,1,0], name:'roof'});
  }
  const parts = defs.map(d=>{
    const mesh = new THREE.Mesh(d.geo, mat.clone());
    mesh.position.set(...d.pos); group.add(mesh);
    return { mesh, name:d.name, origPos:mesh.position.clone(), origQuat:mesh.quaternion.clone(),
             dir:new THREE.Vector3(...d.dir), scale:0.9 };
  });
  return {group, parts};
}

function loadTemplate(project){
  const img = new Image();
  img.onload = ()=>{
    clearScene();
    const tex = new THREE.Texture(img); tex.needsUpdate = true; tex.encoding = THREE.sRGBEncoding;
    const built = buildTemplateGroup(project.shape, tex);
    currentGroup = built.group; parts = built.parts; scene.add(currentGroup);
    camera.position.set(1.6,1.2,1.8); controls.target.set(0,0,0); controls.update();
    document.getElementById('empty').style.display='none';
    document.getElementById('controls').style.display='flex';
    document.getElementById('explode').value=0;
    renderParts();
    setStatus('Detected shape: '+project.shape+' — '+project.label);
  };
  img.src = project.img;
}

// --- project management ---
function renderProjectList(){
  const el = document.getElementById('projList'); el.innerHTML='';
  projects.forEach((p,i)=>{
    const d = document.createElement('div'); d.className='proj';
    d.innerHTML = p.img ? `<img src="${p.img}">` : `<div class="ph">📦</div>` ;
    const span = document.createElement('span'); span.textContent = p.name; d.appendChild(span);
    d.addEventListener('click', ()=>{ selectProject(i); });
    el.appendChild(d);
  });
}
let activeIdx=-1;
function selectProject(i){
  activeIdx=i;
  document.querySelectorAll('.proj').forEach((n,j)=>n.classList.toggle('active', j===i));
  const p = projects[i];
  if(p.mode==='template') loadTemplate(p); else loadGLBFromBase64(p.glb);
  if(window.innerWidth<=640) document.getElementById('sidebar').classList.remove('open');
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file);
  });
}

document.getElementById('addBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('pname').value.trim() || 'Untitled';
  const glbFile = document.getElementById('pglb').files[0];
  const imgFile = document.getElementById('pimg').files[0];
  if(!glbFile){ alert('Choose a .glb file first.'); return; }
  try{
    const glb64 = await fileToBase64(glbFile);
    let img = null;
    if(imgFile){ img = await fileToDataURL(imgFile); }
    projects.push({ id: Date.now(), name, glb: glb64, img });
    saveProjects(); renderProjectList();
    document.getElementById('pname').value='';
    document.getElementById('pglb').value=''; document.getElementById('pimg').value='';
    selectProject(projects.length-1);
  } catch(e){ alert('Could not read that file.'); console.error(e); }
});

document.getElementById('addPhotoBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('phname').value.trim() || 'Untitled';
  const photoFile = document.getElementById('pphoto').files[0];
  if(!photoFile){ alert('Choose a photo first.'); return; }
  try{
    const dataUrl = await fileToDataURL(photoFile);
    const img = new Image();
    img.onload = ()=>{
      const result = classifyShapeFromImage(img);
      projects.push({ id:Date.now(), name, img:dataUrl, mode:'template',
                       shape:result.shape, label:result.label });
      saveProjects(); renderProjectList();
      document.getElementById('phname').value=''; document.getElementById('pphoto').value='';
      selectProject(projects.length-1);
    };
    img.src = dataUrl;
  } catch(e){ alert('Could not read that image.'); console.error(e); }
});

document.getElementById('menuBtn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
});

renderProjectList();
resize();
if(projects.length) selectProject(0);
</script>
</body>
</html>
